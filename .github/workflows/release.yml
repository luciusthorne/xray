name: release

# Pushing a tag vX.Y.Z builds the package from that tag, checks it, creates the
# GitHub release with the files and the CHANGELOG section, and publishes to PyPI
# through trusted publishing (no token) once the repository variable
# PYPI_PUBLISHING is "enabled". "Run workflow" with a tag publishes an existing
# release to PyPI later, for example after trusted publishing was set up.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish to PyPI (for example v1.1.0)"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # PyPI trusted publishing
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: The tag must match the package version
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('xray/__init__.py').read()).group(1))")
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match xray.__version__ $version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and check the distributions
        run: |
          python -m pip install --no-cache-dir build twine
          python -m build
          python -m twine check --strict dist/*

      - name: The built wheel installs and runs (the full suite runs in the tests workflow)
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --no-cache-dir dist/*.whl
          cd /tmp
          test "$(/tmp/wheel-check/bin/xray --version)" = "xray $VERSION"
          /tmp/wheel-check/bin/xray inspect ls --no-packages > /dev/null
          /tmp/wheel-check/bin/xray "$(command -v ls)" --code > /dev/null

      - name: Create the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="## $VERSION" '$0==v{f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release create "$TAG" dist/* --title "XRAY $VERSION" --notes-file notes.md

      - name: Publish to PyPI
        if: vars.PYPI_PUBLISHING == 'enabled'
        uses: pypa/gh-action-pypi-publish@release/v1
