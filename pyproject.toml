[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xray-trust"
description = "Explain what Linux commands, scripts and binaries do, with evidence"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dynamic = ["version"]

[project.scripts]
xray = "xray.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "tomli>=2; python_version < '3.11'",
]

[tool.setuptools]
packages = ["xray"]

[tool.setuptools.dynamic]
version = {attr = "xray.__version__"}
