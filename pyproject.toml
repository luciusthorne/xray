[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xray"
version = "0.9.55"
description = "Dependency and static analysis for Python projects and commands"
requires-python = ">=3.10"

[project.scripts]
xray = "xray.cli:main"

[tool.setuptools.packages.find]
include = ["xray*"]
