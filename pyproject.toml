[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xray"
description = "Dependency and static analysis for Python projects and commands"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

[project.scripts]
xray = "xray.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "tomli>=2; python_version < '3.11'",
]

[tool.setuptools]
packages = ["xray"]

[tool.setuptools.dynamic]
version = {attr = "xray.__version__"}
