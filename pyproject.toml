[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xray"
version = "0.8.5"
description = "Python project dependency analyzer"
requires-python = ">=3.10"

[project.scripts]
xray = "xray.cli:main"

[tool.setuptools.packages.find]
include = ["xray*"]
